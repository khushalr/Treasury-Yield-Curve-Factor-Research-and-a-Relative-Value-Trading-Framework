name: Python checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q src scripts tests
      - run: python -m pytest -q
      - run: python -m scripts.generate_demo_data
      - run: python -m scripts.run_backtest --data data/demo_curve.csv --pca-window 60 --signal-window 20 --entry-z 1.0 --output reports/ci-demo
