name: Factor stability research
on:
  pull_request:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt matplotlib
      - run: python -m scripts.report_factor_stability
      - uses: actions/upload-artifact@v4
        with:
          name: descriptive-factor-stability
          path: reports/factor_stability/
          if-no-files-found: error
